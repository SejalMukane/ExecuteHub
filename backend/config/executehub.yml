# ExecuteHub orchestration settings.
# Loaded via Rails.application.config_for(:executehub) in config/application.rb.
# The `defaults` key provides values shared by every environment.
defaults: &defaults
  # Number of tests bundled into a single Job chunk when a TestRun is scheduled.
  chunk_size: 20
  # Number of logical workers in the pool. MUST match Sidekiq's concurrency
  # (config/sidekiq.yml :concurrency) so every worker thread maps 1:1 to a
  # logical worker and multiple jobs from the same TestRun run simultaneously.
  worker_pool_size: 5
  # Seconds between HeartbeatWorker passes (each worker reports a heartbeat).
  heartbeat_interval_seconds: 5
  # A worker is marked Offline when its last heartbeat is older than this.
  heartbeat_stale_seconds: 15
  # Maximum automatic retries per job (Docker failure / worker crash / network).
  max_job_retries: 3
  # Delay before a retried job is re-enqueued (gives infra time to recover).
  retry_delay_seconds: 5
  # Hard ceiling for a single job's container execution before it is killed.
  worker_execution_timeout_seconds: 600
  # Simulated processing time (seconds) used by TestExecutionWorker before
  # marking a job as complete. No real browser execution happens yet.
  worker_simulate_delay: 1
  # Worker execution settings: the Docker image + container layout used by
  # WorkerExecutor to run Playwright tests for each Job.
  worker:
    # Image built from /Dockerfile.playwright (docker build -f Dockerfile.playwright -t executehub-playwright:latest .)
    image: executehub-playwright:latest
    # Command executed when the container starts (working dir = container_workdir).
    command: ["npx", "playwright", "test"]
    # Working directory inside the container (where package.json/tests live).
    container_workdir: /app
    # Container path where Playwright writes its output (config outputDir).
    container_artifacts_path: /app/artifacts
    # Name of the JSON report written by the Playwright "json" reporter.
    results_file: test-results.json

development:
  <<: *defaults

test:
  <<: *defaults

production:
  <<: *defaults

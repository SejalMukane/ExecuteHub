# ExecuteHub orchestration settings.
# Loaded via Rails.application.config_for(:executehub) in config/application.rb.
# The `defaults` key provides values shared by every environment.
defaults: &defaults
  # Number of tests bundled into a single Job chunk when a TestRun is scheduled.
  chunk_size: 20
  # Number of logical workers in the pool. MUST match Sidekiq's concurrency
  # (config/sidekiq.yml :concurrency) so every worker thread maps 1:1 to a
  # logical worker and multiple jobs from the same TestRun run simultaneously.
  worker_pool_size: 5
  # Seconds between HeartbeatWorker passes (each worker reports a heartbeat).
  heartbeat_interval_seconds: 5
  # A worker is marked Offline when its last heartbeat is older than this.
  heartbeat_stale_seconds: 15
  # Maximum automatic retries per job (Docker failure / worker crash / network).
  max_job_retries: 3
  # Delay before a retried job is re-enqueued (gives infra time to recover).
  retry_delay_seconds: 5
  # Hard ceiling for a single job's container execution before it is killed.
  worker_execution_timeout_seconds: 600
  # Days an uploaded artifact is kept before ArtifactCleanupJob removes it.
  # Can be overridden with the ARTIFACT_RETENTION_DAYS env var.
  artifact_retention_days: 30
  # Default lifetime (seconds) of artifact signed URLs. Can be overridden with
  # the ARTIFACT_SIGNED_URL_TTL env var.
  artifact_signed_url_ttl: 900
  # Simulated processing time (seconds) used by TestExecutionWorker before
  # marking a job as complete. No real browser execution happens yet.
  worker_simulate_delay: 1
  # Worker execution settings: the Docker image + container layout used by
  # WorkerExecutor to run Playwright tests for each Job.
  worker:
    # Image built from /Dockerfile.playwright (docker build -f Dockerfile.playwright -t executehub-playwright:latest .)
    image: executehub-playwright:latest
    # Command executed when the container starts (working dir = container_workdir).
    command: ["npx", "playwright", "test"]
    # Working directory inside the container (where package.json/tests live).
    container_workdir: /app
    # Container path where Playwright writes its output (config outputDir).
    container_artifacts_path: /app/artifacts
    # Name of the JSON report written by the Playwright "json" reporter.
    results_file: test-results.json

  # Jenkins integration (Week 8). Credentials NEVER live here — they are read
  # from the environment (JENKINS_URL, JENKINS_USERNAME, JENKINS_API_TOKEN,
  # JENKINS_JOB_NAME) inside JenkinsService. This section only holds tuning
  # values and non-secret defaults.
  jenkins:
    # Seconds between JenkinsBuildStatusJob polls. Grows exponentially
    # (5s -> 10s -> 20s -> 40s) up to poll_max_attempts.
    poll_interval_seconds: 5
    poll_max_attempts: 30
    # Connection timeouts for Jenkins HTTP calls (seconds).
    open_timeout_seconds: 10
    read_timeout_seconds: 30
    # Whether the local Jenkins instance requires a CSRF crumb for unsafe
    # (POST/DELETE) requests. Auto-detected when true; see JenkinsHttpClient.
    csrf_crumb_enabled: true
    # Optional shared secret used to validate POST /ci/jenkins/callback
    # requests (X-Jenkins-Callback-Secret header). Empty disables the check.
    # Set via the JENKINS_CALLBACK_SECRET env var.
    callback_shared_secret: ""

  # Release gating defaults (Week 8). Per-project overrides live in
  # projects.release_policy (jsonb). See ReleaseGateService.
  release_gate:
    # Minimum success rate (%) a completed TestRun needs for the gate to pass.
    minimum_success_rate: 95
    # Test suites that MUST have run and passed (by name) for the gate to pass.
    required_suites: []
    # When true, a passing run leaves the DeploymentGate pending a human
    # approval instead of auto-approving. Overridable per project via
    # projects.release_policy["requires_manual_approval"].
    requires_manual_approval: false

  # CI trigger defaults (Week 8). See CiTriggerService.
  ci:
    # Fallback test count when Jenkins triggers a run without total_tests or a
    # test_suite_id. Only used for CI-triggered runs.
    default_total_tests: 20
    # Fallback branch when Jenkins omits branch.
    default_branch: main

development:
  <<: *defaults

test:
  <<: *defaults

production:
  <<: *defaults
